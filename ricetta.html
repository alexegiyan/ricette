<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ricetta — quanto cucinare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>:root{--ink:#16211B;--paper:#EEF1EB;--rule:#C9D2C6;--muted:#5C6B60;--signal:#1F4FD8;--warn:#B4531A;--card:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 64px}
.back{display:inline-block;margin:20px 0 0;font-size:15px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--signal)}
.cover{position:relative;margin:16px -20px 24px;height:170px;overflow:hidden}
.cover .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:68px;background:linear-gradient(160deg,#D8E2D2,#B9C9B4)}
h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1.05;margin:0 0 12px;letter-spacing:-.02em}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.meta span{font-size:14px;background:var(--card);border:1px solid var(--rule);padding:5px 11px;border-radius:999px}
h2{font-family:"Archivo",sans-serif;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:36px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.who{display:flex;flex-wrap:wrap;gap:10px}
.who label{flex:1 1 calc(50% - 5px);cursor:pointer;position:relative}
.who input{position:absolute;opacity:0;width:0;height:0}
.who .chip{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid var(--rule);background:var(--card);border-radius:12px;padding:13px 15px;font-weight:600;transition:border-color .12s,background .12s}
.who .chip small{font-family:"Roboto Mono",monospace;font-size:12px;font-weight:500;color:var(--muted)}
.who input:checked + .chip{border-color:var(--signal);background:#EEF2FF}
.who input:checked + .chip small{color:var(--signal)}
.who input:focus-visible + .chip{outline:3px solid var(--signal);outline-offset:2px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:0 0 8px}
th.num,td.num{text-align:right}
td{padding:11px 0;border-top:1px solid var(--rule);vertical-align:baseline}
td.name{font-weight:600}
td.name em{display:block;font-weight:400;font-style:normal;font-size:14px;color:var(--muted)}
td.num{font-family:"Roboto Mono",monospace;font-weight:700;font-size:20px;white-space:nowrap}
td.num .u{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.free{font-family:"Source Sans 3",sans-serif;font-size:15px;font-weight:400;color:var(--muted)}
.breakdown{font-family:"Roboto Mono",monospace;font-size:12px;color:var(--muted);padding:0 0 11px;border:0}
.empty{background:#FFF6E8;border:1px solid #E8C99A;border-radius:12px;padding:16px;margin-top:16px;font-size:16px}
ol{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol li{counter-increment:s;position:relative;padding:0 0 20px 44px}
ol li::before{content:counter(s);position:absolute;left:0;top:1px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:"Roboto Mono",monospace;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.note{background:var(--card);border-left:3px solid var(--warn);padding:14px 16px;margin:20px 0 0;font-size:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.tools li{font-size:15px;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 12px}
footer{margin-top:44px;font-size:14px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Tutte le ricette</a>
  <div class="cover"><div class="fallback" id="emo">🍳</div></div>
  <h1 id="tit">Carico…</h1>
  <div class="meta" id="met"></div>
  <div id="content" hidden>
  <h2>Chi mangia</h2>
  <div class="who" id="who">
    <label><input type="checkbox" data-k="alex" checked><span class="chip">Alex <small>100%</small></span></label>
    <label><input type="checkbox" data-k="max" checked><span class="chip">Max <small>75%</small></span></label>
    <label><input type="checkbox" data-k="mamma" checked><span class="chip">Mamma <small>40%</small></span></label>
    <label><input type="checkbox" data-k="papa" checked><span class="chip">Papà <small>50%</small></span></label>
  </div>
  <h2>Quanto mettere in pentola</h2>
  <table id="ing"><thead><tr><th>Ingrediente</th><th class="num">Totale</th></tr></thead><tbody></tbody></table>
  <div class="empty" id="empty" hidden>Nessuno selezionato — spunta almeno una persona qui sopra.</div>
  <h2>Cosa serve</h2>
  <ul class="tools" id="too"></ul>
  <h2>Come si fa</h2>
  <ol id="ste"></ol>
  <div class="note" id="nte"></div>
  <footer>Le quantità si aggiornano da sole in base a chi hai spuntato.</footer>
  </div>
</div>
<script>
const RATIO={"alex":1,"max":0.75,"mamma":0.4,"papa":0.5};
const NAMES={"alex":"Alex","max":"Max","mamma":"Mamma","papa":"Papà"};
const ORDER=["alex","max","mamma","papa"];
let BASE=[];
const slug=new URLSearchParams(location.search).get("r")||"";
const boxes=[...document.querySelectorAll("#who input")];
const tbody=document.querySelector("#ing tbody");
const empty=document.getElementById("empty");
function render(){
  const on=ORDER.filter(k=>boxes.find(b=>b.dataset.k===k).checked);
  const factor=on.reduce((s,k)=>s+RATIO[k],0);
  empty.hidden=on.length>0;
  tbody.innerHTML="";
  BASE.forEach(ing=>{
    const tr=document.createElement("tr");
    const td1=document.createElement("td");
    td1.className="name";
    td1.innerHTML=ing.name+(ing.hint?"<em>"+ing.hint+"</em>":"");
    const td2=document.createElement("td");
    td2.className="num";
    let quote={};
    if(ing.unit==="n"){on.forEach(k=>quote[k]=Math.max(1,Math.round(ing.qty*RATIO[k])));}
    else if(ing.unit){on.forEach(k=>quote[k]=Math.round(ing.qty*RATIO[k]));}
    if(!ing.unit){td2.innerHTML='<span class="free">a piacere</span>';}
    else if(ing.unit==="n"){td2.textContent=on.reduce((s,k)=>s+quote[k],0)||0;}
    else{td2.innerHTML=Math.round(ing.qty*factor)+'<span class="u">'+ing.unit+'</span>';}
    tr.append(td1,td2);tbody.append(tr);
    if(ing.unit&&on.length>1){
      const det=document.createElement("tr");const td=document.createElement("td");
      td.colSpan=2;td.className="breakdown";
      td.textContent=on.map(k=>NAMES[k]+" "+quote[k]+(ing.unit==="n"?"":ing.unit)).join("  ·  ");
      det.append(td);tbody.append(det);
    }
  });
}
const grab=u=>fetch(u).then(r=>r.ok?r.json():{}).catch(()=>({}));
Promise.all([grab("ricette.json"),grab("ricette-extra.json")]).then(([a,b])=>{
  const all=Object.assign({},a,b);
  const d=all[slug];
  if(!d){document.getElementById("tit").textContent="Ricetta non trovata";
    document.getElementById("met").innerHTML='<span>Torna all\'elenco e riapri il link</span>';return;}
  document.title=d.n+" — quanto cucinare";
  document.getElementById("emo").textContent=d.e;
  document.getElementById("tit").textContent=d.n;
  document.getElementById("met").innerHTML="<span>⏱ "+d.t+" minuti</span><span>🍽 "+d.m+"</span>";
  document.getElementById("too").innerHTML=d.u.map(x=>"<li>"+x+"</li>").join("");
  document.getElementById("ste").innerHTML=d.s.map(x=>"<li>"+x+"</li>").join("");
  document.getElementById("nte").innerHTML=d.note;
  BASE=d.i.map(a2=>({name:a2[0],qty:a2[1],unit:a2[2],hint:a2[3]}));
  document.getElementById("content").hidden=false;
  render();
}).catch(()=>{document.getElementById("tit").textContent="Errore di caricamento";});
boxes.forEach(b=>b.addEventListener("change",render));
</script>
</body>
</html>
